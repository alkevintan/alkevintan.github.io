<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Something went wrong · AktiveSolutions</title>
  <style>
    :root{color-scheme:light}
    *{margin:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#f8fafc;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .wrap{max-width:520px;text-align:center}
    .mark{width:56px;height:56px;border-radius:14px;background:#059669;display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px}
    .code{font-size:14px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#059669}
    h1{font-size:32px;margin:12px 0}
    p{color:#475569;font-size:17px;line-height:1.6}
    a.btn{display:inline-block;margin-top:28px;background:#059669;color:#fff;text-decoration:none;
      font-weight:600;padding:12px 24px;border-radius:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <span class="mark">
      <svg width="32" height="32" viewBox="0 0 40 40"><path d="M7 25 L15 25 L18 12 L23 31 L26 19 L33 19" stroke="#fbbf24" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </span>
    <p class="code">500</p>
    <h1>Something went wrong</h1>
    <p>We're sorry — an unexpected error occurred on our end. Please try again in a moment.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
