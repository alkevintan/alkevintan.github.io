# AktiveSolutions — deployed to the "westeros" home server with Kamal.
#
# Topology (mirrors the tanventory deploy on the same box):
# - Registry runs ON westeros, bound to 127.0.0.1:5000 (not exposed to the LAN).
#   `bin/deploy` opens an SSH tunnel so this machine's 127.0.0.1:5000 maps to the
#   westeros registry; the image builds locally and pushes through the tunnel.
# - westeros already runs Caddy on 80/443, so Kamal's own proxy is disabled. The
#   app joins Kamal's `kamal` network with the stable alias `aktive_solutions`;
#   Caddy (connected to that network) reverse-proxies the public host to it.
# - Postgres runs as a Kamal accessory (`aktive_solutions-db`) on the same box.

service: aktive_solutions
image: aktive_solutions

servers:
  web:
    hosts:
      - westeros
    # Caddy owns 80/443, so disable kamal-proxy for this (primary) role.
    proxy: false
    options:
      network-alias: aktive_solutions

# Self-hosted registry on westeros (see bin/deploy for the SSH tunnel).
registry:
  server: 127.0.0.1:5000
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

# Build locally with the plain docker driver (this box is amd64 like westeros).
builder:
  arch: amd64
  driver: docker

# westeros SSH access (same as tanventory).
ssh:
  user: keboy
  keys:
    - "~/.ssh/radio_server"

env:
  secret:
    - RAILS_MASTER_KEY
    - AKTIVE_SOLUTIONS_DATABASE_PASSWORD
    - ADMIN_PASSWORD
    - SMTP_PASSWORD
  clear:
    # App reaches the Postgres accessory by its network alias.
    DATABASE_HOST: aktive_solutions-db
    DATABASE_USER: aktive_solutions
    # Real public domain (used for host authorization + absolute URLs).
    APP_HOST: aktivesolutions.com
    # Run Solid Queue inside Puma (single-server home deploy).
    SOLID_QUEUE_IN_PUMA: true
    # Outbound email via Resend SMTP (API key is the SMTP_PASSWORD secret above).
    SMTP_ADDRESS: smtp.resend.com
    SMTP_PORT: "587"
    SMTP_USER_NAME: resend
    SMTP_DOMAIN: aktivesolutions.com
    SMTP_AUTHENTICATION: plain
    # From must be on the Resend-verified domain.
    MAILER_FROM: AktiveSolutions <noreply@aktivesolutions.com>
    # Where new-lead alerts are delivered. Defaults to hello@aktivesolutions.com
    # (needs a real mailbox). Uncomment to route leads to any inbox instead:
    # LEAD_NOTIFICATION_TO: you@example.com

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Persist Active Storage uploads across deploys.
volumes:
  - "aktive_solutions_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight requests.
asset_path: /rails/public/assets

# PostgreSQL accessory (another docker service on westeros, on the kamal network).
accessories:
  db:
    image: postgres:18-alpine
    host: westeros
    options:
      network-alias: aktive_solutions-db
    env:
      clear:
        POSTGRES_USER: aktive_solutions
        POSTGRES_DB: aktive_solutions_production
      secret:
        - POSTGRES_PASSWORD
    volumes:
      # postgres:18 stores data in a version-specific subdir, so the volume must
      # mount the parent /var/lib/postgresql (not /var/lib/postgresql/data).
      - "aktive_solutions_db_data:/var/lib/postgresql"
